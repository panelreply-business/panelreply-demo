name: PanelReply regression tests
on:
  pull_request:
    branches: [main, 'audit/**']
  push:
    branches:
      - main
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-tests:
    # Keep the OS baseline explicit when GitHub moves the latest label.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify intake, private workspace, HTTP and CSP
        env:
          PANELREPLY_EXPECT_PUBLIC_OFFLINE: 'true'
          WORKSPACE_HTTP_TESTS: '1'
        run: |
          node scripts/build-demo.cjs --check
          node --test tests/*.test.cjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the local OCR engine and English data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Verify actual OCR and native failure handling on synthetic images
        run: node scripts/test-ocr-fixtures.cjs
      - name: Install browser test dependency
        run: python -m pip install -r tests/browser-requirements.txt
      - name: Install Chromium for browser checks
        id: browser_install
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Exercise the demo through a real browser
        run: |
          python tests/browser_test.py
          python tests/intake_browser_test.py
      - name: Verify workspace accessibility and capture review images
        env:
          PANELREPLY_EMIT_PREVIEWS: '1'
        run: python tests/ui_browser_test.py
      - name: Verify private inbox, isolation, persistence and failure recovery
        env:
          PANELREPLY_EMIT_WORKSPACE_PREVIEWS: '1'
        run: python tests/workspace_browser_test.py
      - name: Verify record export, encrypted restore and password recovery
        env:
          PANELREPLY_EMIT_RECOVERY_PREVIEWS: '1'
        run: python tests/workspace_recovery_browser_test.py
      - name: Verify the dual-product marketing demonstration
        if: ${{ !cancelled() && steps.browser_install.outcome == 'success' }}
        env:
          PANELREPLY_EMIT_DESIGN_PREVIEWS: '1'
        run: python tests/design_browser_test.py
      - name: Verify private panel editing, images, OCR, exports and failure paths
        if: ${{ !cancelled() && steps.browser_install.outcome == 'success' }}
        run: python tests/panel_browser_test.py
      - name: Verify the unified platform at six viewport widths
        if: ${{ !cancelled() && steps.browser_install.outcome == 'success' }}
        env:
          PANELREPLY_EMIT_PLATFORM_PREVIEWS: '1'
        run: python tests/platform_visual_browser_test.py

